window.DARKMOON_RULES="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function signedIn() {\n      return request.auth != null;\n    }\n    function admin() {\n      return signedIn()\n        && exists(/databases/$(database)/documents/admins/$(request.auth.uid))\n        && get(/databases/$(database)/documents/admins/$(request.auth.uid)).data.enabled == true;\n    }\n    function validRecord() {\n      let record = request.resource.data;\n      return record.keys().hasAll(['payload', 'revision', 'updatedAt', 'updatedBy'])\n        && record.keys().hasOnly(['payload', 'revision', 'updatedAt', 'updatedBy'])\n        && record.payload is string\n        && record.payload.size() > 0\n        && record.payload.size() <= 800000\n        && record.revision is int\n        && record.revision >= 1\n        && record.updatedAt == request.time\n        && record.updatedBy == request.auth.uid;\n    }\n    match /admins/{uid} {\n      allow get: if signedIn() && request.auth.uid == uid;\n      allow list, create, update, delete: if false;\n    }\n    match /leagues/{leagueId} {\n      allow get: if signedIn();\n      allow list: if false;\n      allow create: if admin() && validRecord() && request.resource.data.revision == 1;\n      allow update: if admin() && validRecord()\n        && request.resource.data.revision == resource.data.revision + 1;\n      allow delete: if false;\n    }\n    match /voting/{leagueId} {\n      allow read: if true;\n      allow write: if admin();\n      match /polls/{pollId} {\n        allow read: if true;\n        allow create: if admin() && request.resource.data.status == 'open'\n          && request.resource.data.candidateIds is list\n          && request.resource.data.candidateIds.size() > 0\n          && request.resource.data.candidateIds.size() <= 12;\n        allow update: if admin() && resource.data.status == 'open'\n          && request.resource.data.status == 'closed'\n          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','closedAt']);\n        allow delete: if false;\n        match /ballots/{uid} {\n          allow read: if true;\n          allow create: if signedIn() && request.auth.uid == uid\n            && get(/databases/$(database)/documents/voting/$(leagueId)/polls/$(pollId)).data.status == 'open'\n            && request.resource.data.keys().hasOnly(['playerId','createdAt'])\n            && request.resource.data.playerId in get(/databases/$(database)/documents/voting/$(leagueId)/polls/$(pollId)).data.candidateIds\n            && request.resource.data.createdAt == request.time;\n          allow update, delete: if false;\n        }\n      }\n    }\n    match /{document=**} {\n      allow read, write: if false;\n    }\n  }\n}\n";
window.DARKMOON_GUIDE="# 連接 Firebase\n\n## 開啟比賽與 MVP 投票\n\n請先發布這次更新的 `firestore.rules`，否則投票資料會被原本規則拒絕。管理者在「對局紀錄」設定板子、座位、姓名、身分與陣營，儲存後按「開啟比賽」。同一聯賽同時只能開啟一場投票。開啟後鎖定板子、座位與身分，仍可輸入勝方和成績。\n\n參與者在有開放比賽時登入，會自動跳到「MVP 投票」。每個 Firebase 帳號每場一票，送出後不可更改。投票對象必須是該場玩家；管理者可在投票頁按「結束投票」，結束後禁止新增票、不可重開。管理者帳號也可投票；目前不限投票者必須在當場座位中，亦未禁止投自己。\n\n公開資料位於 `voting/{聯賽ID}/polls/{場次ID}` 及其 `ballots` 子集合。只要載入同一 Firebase 設定，即使未登入也能查看所有已開放場次的玩家座位、板子、逐人票數及總票數。公開名單不含角色／陣營；投票紀錄不存 Email 或投票者姓名，票券文件 ID 使用帳號 UID 以防重複。既有登入者可讀的聯賽資料仍包含完整角色紀錄，此版不是角色資料保密系統。\n\n投票紀錄獨立保存，不會被聯賽 JSON 還原覆蓋，亦不會自動覆蓋成績表內的 MVP 欄位。結束後可依公開票數填入該場成績。投票資料可由 Firebase Console 備份。此流程已用 SDK 替身完成瀏覽器測試，實際專案及安全規則仍須部署後驗證。\n\n目前未綁定 Firebase 專案。未連線時預設以參與者身分唯讀顯示本機資料；登入本機管理帳號後可編輯。設定 Firebase 後，可使用登入帳號讀取雲端聯賽；管理者可以管理完整資料，參與者顯示「賽季總覽」、「積分排名」與「MVP 投票」。\n\n第一次設定：點右上角「登入」，展開「首次設定 Firebase」貼上公開設定，再登入帳號。管理者資格由 `admins/{uid}` 的 `enabled: true` 決定；無此資格的帳號不會顯示管理頁、編輯、匯出或備份入口。登出或權限撤銷會立即關閉管理頁面及管理表單。\n\n交付的 HTML 內嵌原始名單與成績。Firebase 登入管控雲端讀寫；若公開部署，HTML 內的初始資料也會隨網頁提供。設定頁的「下載已套用設定的 HTML」只加入公開連線設定，日後資料變更由登入後的雲端聯賽讀取。\n\n## 1. 建立專案與網頁應用程式\n\n1. 開啟 [Firebase 控制台](https://console.firebase.google.com/)，建立專案。\n2. 在「專案設定 → 一般」新增網頁應用程式（`</>`）。\n3. 複製 `firebaseConfig` 物件的公開設定。網頁設定入口需要 `apiKey`、`authDomain`、`projectId`、`appId`。也可包含 `storageBucket`、`messagingSenderId` 等欄位。\n4. 在右上角「登入 → 首次設定 Firebase」填入設定，已有管理者權限後也能從「雲端與備份」管理連線。不要貼服務帳戶 JSON、`private_key` 或 Admin SDK 私鑰。公開設定的用途是識別專案，資料權限由 Authentication 與 Firestore 規則控制。\n\n設定物件範例（請換成控制台實際數值）：\n\n```json\n{\n  \"apiKey\": \"YOUR_WEB_API_KEY\",\n  \"authDomain\": \"YOUR_PROJECT_ID.firebaseapp.com\",\n  \"projectId\": \"YOUR_PROJECT_ID\",\n  \"appId\": \"YOUR_WEB_APP_ID\"\n}\n```\n\n## 2. 啟用登入並建立帳號\n\n1. 開啟「Build → Authentication → Sign-in method」。\n2. 啟用「Email/Password」的電子郵件與密碼登入方式。\n3. 到「Users」按「Add user」，建立管理員的電子郵件與密碼，複製該帳號的 UID。\n4. 在 Authentication 設定的「Authorized domains」加入實際部署網域；本機測試若需要，加入 `localhost`。請填網域本身，不含 `https://` 或路徑。\n\n網頁沒有開放註冊按鈕。要提供其他人查看，可在控制台建立帳號。規則允許同一 Firebase 專案中已登入的帳號讀取聯賽，因此專案中的其他應用若共用 Authentication，也會共用此讀取範圍。\n\n## 3. 建立 Firestore 與管理員資格\n\n1. 開啟「Build → Firestore Database」，建立預設 `(default)` 資料庫，選擇 Standard edition 與適當地區。\n2. 使用正式模式建立，將本資料夾的 `firestore.rules` 全文貼到「Rules」並按 Publish。\n3. 到「Data」新增集合 `admins`。\n4. 文件 ID 填入剛才複製的管理員 UID。\n5. 新增欄位 `enabled`，型別選 **boolean**，數值設為 **true**。\n\n管理員資格只能由控制台或受信任的管理工具維護。網頁無法自行授予管理員權限。取消管理員資格時，將 `enabled` 改為 `false`，正在開啟的網頁會停止允許編輯。\n\n規則要求登入才可讀取，而且只有啟用的管理員可寫入；不允許從網頁刪除整份聯賽。不要使用 `allow read, write: if true` 的測試規則。\n\n## 4. 第一次匯入\n\n1. 在網頁連接 Firebase，使用管理員帳號登入。\n2. 等待雲端讀取完成。若該聯賽 ID 還沒有資料，使用匯入本機資料的操作。\n3. 匯入只會建立空的雲端聯賽，不會覆蓋已存在的資料。其他裝置填入相同的專案設定與聯賽 ID、登入後，即可讀取同一份資料。\n4. 之後每次儲存使用 Firestore transaction 比對版本。其他人先修改時，舊版本的儲存會被拒絕，請重新檢查最新資料後再編輯。\n\nFirestore 路徑為 `leagues/{聯賽ID}`，預設 ID 是 `darkmoon`。資料存為 JSON 字串 `payload`，並包含遞增的 `revision`、`updatedAt` 和 `updatedBy`。此版本每份聯賽上限為 800,000 UTF-8 bytes，適合本次 Excel 規模。JSON 內部欄位由網頁驗證；Firestore 規則驗證外層格式與管理員資格。請只把可信任的維護人員設為管理員。\n\n## 5. 使用 Firebase Hosting（可選）\n\n網頁可放在一般靜態網站主機，資料仍使用 Firebase。若要一起放在 Firebase Hosting，在此專案資料夾執行：\n\n```powershell\nnpm install -g firebase-tools\nfirebase login\nfirebase deploy --project YOUR_PROJECT_ID --only firestore:rules,hosting\n```\n\n`firebase.json` 已將網站目錄設為 `dist`，不需另行執行 `firebase init`。先將 `YOUR_PROJECT_ID` 換成真實 ID。這個指令會發布本專案的規則及網站。\n\n如只要發布安全規則：\n\n```powershell\nfirebase deploy --project YOUR_PROJECT_ID --only firestore:rules\n```\n\n## 驗證連線\n\n- 以管理員登入後，確認可匯入與儲存，重新整理仍能取得資料。\n- 用另一個瀏覽器登入相同專案與聯賽，確認修改會同步。\n- 用未加入 `admins` 的帳號登入，確認只能查看。\n- 兩個視窗同時編輯，第二個視窗儲存舊版本時應收到版本衝突訊息。\n- 中斷網路時，畫面應顯示斷線或等待雲端確認，不應顯示新的儲存成功訊息。\n\n目前因尚未建立實際 Firebase 專案，未執行真實專案的登入、權限、同步端到端驗證。完成設定後應執行上述驗證。\n\n官方文件：[網頁 SDK 設定](https://firebase.google.com/docs/web/alt-setup)、[密碼登入](https://firebase.google.com/docs/auth/web/password-auth)、[即時監聽](https://firebase.google.com/docs/firestore/query-data/listen)、[交易與版本檢查](https://firebase.google.com/docs/firestore/manage-data/transactions)、[Firestore 安全規則](https://firebase.google.com/docs/firestore/security/get-started)。\n\n## 指定的本機管理帳號\n\n右上角「登入」可使用帳號 `ntnuwsc` 與使用者指定的密碼。密碼以 PBKDF2- const scoringModule=(()=>{
// The scoring rules mirror the formulas in the supplied league workbook.
const FACTIONS = ['好人', '狼人', '第三方'];
const VIOLATIONS = ['無', '輕度', '中度', '重度'];
const DEFAULT_RULES = Object.freeze({
  baseScore: 1, winBonus: 1, mvpVoteBonus: 0.25,
  penalties: Object.freeze({ '無': 0, '輕度': 0.5, '中度': 1, '重度': 1.5 }),
  minimumGames: 6, dropHighest: 1,
  dropLowestBands: Object.freeze([
    Object.freeze({ min: 6, max: 10, count: 1 }),
    Object.freeze({ min: 11, max: 15, count: 2 }),
    Object.freeze({ min: 16, max: 20, count: 3 }),
    Object.freeze({ min: 21, max: null, count: 4 }),
  ]),
  ties: 'competition',
});

const present = value => typeof value === 'string' && value.trim().length > 0;
const sum = values => values.reduce((a, b) => a + b, 0);
const nearlyEqual = (a, b) => Math.abs(a - b) < 1e-10;

function isCompletedMatch(match) {
  return (match.status === undefined || match.status === 'completed') &&
    FACTIONS.includes(match.winner) && match.entries.some(entry => present(entry.playerId));
}

function scoreEntry(entry, match, rules = DEFAULT_RULES) {
  const base = entry.baseScore ?? rules.baseScore;
  const votes = entry.mvpVotes ?? 0;
  const violation = entry.violation || '無';
  const penalty = rules.penalties[violation];
  if (![base, votes, penalty, rules.winBonus, rules.mvpVoteBonus].every(Number.isFinite)) {
    throw new Error('計分欄位必須是有效數字，且違規程度必須有效。');
  }
  return base + (present(match.winner) && entry.faction === match.winner ? rules.winBonus : 0) +
    votes * rules.mvpVoteBonus - penalty;
}

function buildStandings(data) {
  const rules = data.rules || DEFAULT_RULES;
  const result = data.players.map(player => ({
    id: player.id, playerId: player.id, name: player.name, member: player.member,
    games: 0, total: 0, rawAverage: null, officialAverage: null,
    eligible: false, rank: null, wins: 0, mvpVotes: 0,
    dropHigh: 0, dropLow: 0, droppedHighTotal: null, droppedLowTotal: null,
    effectiveGames: null, scores: [],
  }));
  const byId = new Map(result.map(row => [row.playerId, row]));
  for (const match of data.matches) {
    if (!isCompletedMatch(match)) continue;
    for (const entry of match.entries) {
      if (!present(entry.playerId)) continue;
      const player = byId.get(entry.playerId);
      if (!player) throw new Error(`第 ${match.number} 場有未登錄的玩家。`);
      const won = entry.faction === match.winner;
      player.scores.push({
        matchId: match.id, number: match.number, board: match.board,
        seat: entry.seat, role: entry.role, faction: entry.faction,
        score: scoreEntry(entry, match, rules), won, mvpVotes: entry.mvpVotes ?? 0,
        dropped: null,
      });
    }
  }
  for (const player of result) {
    player.games = player.scores.length;
    player.total = sum(player.scores.map(s => s.score));
    player.rawAverage = player.games ? player.total / player.games : null;
    player.wins = player.scores.filter(s => s.won).length;
    player.mvpVotes = sum(player.scores.map(s => s.mvpVotes));
    player.eligible = player.member && player.games >= rules.minimumGames;
    if (!player.eligible) continue;
    player.dropHigh = rules.dropHighest;
    player.dropLow = rules.dropLowestBands.find(band =>
      player.games >= band.min && (band.max === null || player.games <= band.max))?.count ?? 0;
    const ordered = [...player.scores].sort((a, b) => a.score - b.score || a.number - b.number);
    const low = ordered.slice(0, player.dropLow);
    const high = player.dropHigh ? ordered.slice(-player.dropHigh) : [];
    low.forEach(score => { score.dropped = 'low'; });
    high.forEach(score => { score.dropped = 'high'; });
    player.droppedLowTotal = sum(low.map(score => score.score));
    player.droppedHighTotal = sum(high.map(score => score.score));
    const retained = ordered.filter(score => !score.dropped);
    player.effectiveGames = retained.length;
    player.officialAverage = retained.length ? sum(retained.map(score => score.score)) / retained.length : null;
  }
  result.sort((a, b) => {
    if (a.eligible !== b.eligible) return a.eligible ? -1 : 1;
    const aScore = a.eligible ? a.officialAverage : a.rawAverage;
    const bScore = b.eligible ? b.officialAverage : b.rawAverage;
    if (aScore === null && bScore !== null) return 1;
    if (bScore === null && aScore !== null) return -1;
    if (aScore !== null && bScore !== null && !nearlyEqual(aScore, bScore)) return bScore - aScore;
    return a.name.localeCompare(b.name, 'zh-Hant') || a.playerId.localeCompare(b.playerId);
  });
  let lastAverage = null;
  let lastRank = 0;
  let eligibleCount = 0;
  for (const player of result) {
    if (!player.eligible) continue;
    eligibleCount += 1;
    if (lastAverage === null || !nearlyEqual(player.officialAverage, lastAverage)) lastRank = eligibleCount;
    player.rank = lastRank;
    lastAverage = player.officialAverage;
  }
  return result;
}

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

function text(value, label, max = 100, allowEmpty = false) {
  assert(typeof value === 'string' && value.length <= max && (allowEmpty || value.trim().length > 0),
    `${label}必須是${allowEmpty ? '長度適當的' : '非空白'}文字（最多 ${max} 字）。`);
}

function number(value, label, min, max, integer = false) {
  assert(Number.isFinite(value) && value >= min && value <= max && (!integer || Number.isInteger(value)),
    `${label}必須是 ${min} 至 ${max} 的${integer ? '整數' : '數字'}。`);
}

function object(value, label) {
  assert(value !== null && typeof value === 'object' && !Array.isArray(value) &&
    [Object.prototype, null].includes(Object.getPrototypeOf(value)), `${label}格式不正確。`);
}

function checkJSON(value, depth = 0, visited = new Set()) {
  assert(depth <= 20, '資料結構過深。');
  if (value === null || typeof value === 'string' || typeof value === 'boolean') return;
  if (typeof value === 'number') {
    assert(Number.isFinite(value), '資料不能包含無效數字。');
    return;
  }
  assert(typeof value === 'object' && !visited.has(value), '資料必須是有效的 JSON。');
  visited.add(value);
  if (!Array.isArray(value)) object(value, '資料');
  for (const key of Object.keys(value)) {
    assert(!['__proto__', 'constructor', 'prototype'].includes(key), '資料包含不允許的欄位名稱。');
    checkJSON(value[key], depth + 1, visited);
  }
  visited.delete(value);
}

function validateData(data) {
  checkJSON(data);
  object(data, '聯賽資料');
  assert(data.schemaVersion === 1, '此備份的資料版本不支援。');
  text(data.title, '聯賽名稱');
  assert(Array.isArray(data.players) && data.players.length <= 2000, '玩家名單格式不正確或超過 2,000 人。');
  assert(Array.isArray(data.matches) && data.matches.length <= 2000, '對局清單格式不正確或超過 2,000 場。');
  assert(Array.isArray(data.boards) && data.boards.length <= 200, '板子清單格式不正確。');
  for (const board of data.boards) {
    object(board, '板子'); text(board.name, '板子名稱');
    assert(Array.isArray(board.roles) && board.roles.length <= 100, '角色清單格式不正確。');
    board.roles.forEach(role => text(role, '角色名稱'));
  }
  const rules = data.rules;
  object(rules, '計分規則');
  number(rules.baseScore, '預設基礎分', -1000, 1000);
  number(rules.winBonus, '勝利加分', 0, 1000);
  number(rules.mvpVoteBonus, 'MVP 票數加分', 0, 1000);
  object(rules.penalties, '違規扣分');
  VIOLATIONS.forEach(key => number(rules.penalties[key], `${key}違規扣分`, 0, 1000));
  number(rules.minimumGames, '最低參賽場次', 1, 1000, true);
  number(rules.dropHighest, '移除最高分場次', 0, rules.minimumGames - 1, true);
  assert(rules.ties === 'competition', '只支援同分並列的排名方式。');
  assert(Array.isArray(rules.dropLowestBands) && rules.dropLowestBands.length > 0 &&
    rules.dropLowestBands.length <= 100, '最低分排除區間格式不正確。');
  let next = rules.minimumGames;
  rules.dropLowestBands.forEach((band, index) => {
    object(band, '排除區間');
    number(band.min, '區間起始場次', 1, 100000, true);
    assert(band.min === next, '最低分排除區間必須連續且不能重疊。');
    number(band.count, '移除最低分場次', 0, band.min - rules.dropHighest - 1, true);
    if (index === rules.dropLowestBands.length - 1) {
      assert(band.max === null, '最後一個排除區間必須沒有上限。');
    } else {
      number(band.max, '區間結束場次', band.min, 100000, true);
      next = band.max + 1;
    }
  });
  const playerIds = new Set();
  const names = new Set();
  data.players.forEach(player => {
    object(player, '玩家'); text(player.id, '玩家 ID', 100); text(player.name, '玩家姓名', 100);
    assert(/^[a-zA-Z0-9_-]+$/.test(player.id), '玩家 ID 只能使用英數字、底線或連字號。');
    assert(!playerIds.has(player.id), `玩家 ID 重複：${player.id}`);
    const normalizedName = player.name.trim().normalize('NFKC').toLocaleLowerCase('zh-Hant');
    assert(!names.has(normalizedName), `玩家姓名重複：${player.name}`);
    assert(typeof player.member === 'boolean', `${player.name}的社員狀態不正確。`);
    playerIds.add(player.id); names.add(normalizedName);
  });
  const matchIds = new Set();
  const matchNumbers = new Set();
  data.matches.forEach(match => {
    object(match, '對局'); text(match.id, '對局 ID', 100);
    assert(/^[a-zA-Z0-9_-]+$/.test(match.id), '對局 ID 只能使用英數字、底線或連字號。');
    number(match.number, '對局編號', 1, 999999, true);
    assert(!matchIds.has(match.id), `對局 ID 重複：${match.id}`);

const KEY='darkmoon-league-data-v1', CONFIG='darkmoon-firebase-v1';
function validateLeague(input){
 validateData(input);
 const r=input.rules,s=seed.rules;
 const same=['baseScore','winBonus','mvpVoteBonus','minimumGames','dropHighest','ties'].every(k=>r[k]===s[k])&&Object.keys(s.penalties).every(k=>r.penalties[k]===s.penalties[k])&&r.dropLowestBands.length===s.dropLowestBands.length&&r.dropLowestBands.every((b,i)=>['min','max','count'].every(k=>b[k]===s.dropLowestBands[i][k]));
 if(!same)throw new Error('此網頁沿用原 Excel 的固定計分規則，無法還原使用其他規則的備份。');
 return input;
}

function statusText(){return mode==='cloud'?(cloudStatus.kind==='online'?'Firebase 即時同步':cloudStatus.message):'本機模式 · 儲存於此瀏覽器';}
function updateStatus(){document.querySelectorAll('[data-sync-status]').forEach(el=>{el.textContent=statusText();el.className=`status ${mode==='cloud'?cloudStatus.kind:''}`;});for(const selector of ['#connection-status','#account-connection-status']){const el=$(selector);if(el)el.textContent=cloudStatus.message;}}
function header(title,subtitle,actions=''){return `<div class="page-heading"><div><div class="eyebrow">DARKMOON LEAGUE</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="actions">${actions}</div></div>`;}

function renderVoting(){
 return header('MVP 投票','每個登入帳號每場一票；所有場次的票數即時公開。')+(pollError?`<div class="notice error">${esc(pollError)}</div>`:'')+(!cloud?'<div class="notice">請透過右上角登入入口連接 Firebase，即可讀取公開投票紀錄。</div>':'')+`<div class="match-grid">${polls.map(p=>{
 const mine=p.ballots.find(v=>v.uid===cloudUser?.uid),total=p.ballots.length;
 const counts=Object.fromEntries(p.candidateIds.map(id=>[id,p.ballots.filter(v=>v.playerId===id).length]));
 return `<section class="panel form-panel"><div class="match-card-head"><span>第 ${p.number} 場</span>${badge(p.status==='open'?'投票開放中':'投票已結束',p.status==='open'?'':'muted')}</div><h2 style="margin-top:16px">${esc(p.board)}</h2><p>${p.ready?`已收到 ${total} 票`:'正在確認票數…'}${mine?' · 你已投票':''}</p>${p.candidates.map(c=>`<label class="vote-candidate"><input type="radio" name="vote-${esc(p.id)}" value="${esc(c.playerId)}" ${mine?.playerId===c.playerId?'checked':''} ${p.status!=='open'||mine||!p.ready?'disabled':''}><span><b>${c.seat} 號 · ${esc(c.name)}</b><span class="vote-bar" style="--vote-width:${total?counts[c.playerId]/total*100:0}%"></span></span><strong class="num">${counts[c.playerId]} 票</strong></label>`).join('')}<div class="actions" style="margin-top:20px">${p.status==='open'&&!mine?button(cloudUser?'確認投票':'登入後投票','cast-vote',true,'',`data-id="${esc(p.id)}" ${p.ready?'':'disabled'}`):''}${p.status==='open'?button('結束投票','close-voting',false,'',`data-id="${esc(p.id)}"`):''}</div><p class="note" style="margin:14px 0 0">${mine?'投票已記錄，不能重複投票或更改。':'票數公開；不顯示投票者姓名或 Email。'}</p></section>`;
 }).join('')||'<section class="panel empty">尚未開啟任何比賽投票。<br>管理者可先在對局紀錄設定板子、座位與身分，再按「開啟比賽」。</section>'}</div>`;
}

 $('#app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="moon-mark"></div><div><strong>暗月聯賽</strong><small>DARKMOON LEAGUE</small></div></div><div class="nav-label">${manager()?'聯賽管理':'聯賽資訊'}</div><nav aria-label="主要導覽">${nav}</nav><div class="sidebar-bottom"><div class="storage-card"><div class="storage-title">${icon('cloud')}${mode==='cloud'?'雲端資料已連接':'讓每一場，自動同步'}</div><p>${mode==='cloud'?'對局更新會同步至其他已登入的裝置。':'設定 Firebase，在不同裝置管理同一份聯賽紀錄。'}</p><button class="text-button" data-route="settings">${mode==='cloud'?'管理連線':'設定雲端同步'}　↗</button></div><div class="side-footer"><span class="initial">月</span><div>${manager()?'暗月聯賽管理台':'暗月聯賽觀賽台'}<br><small>${manager()?'管理者':'參與者'}</small></div></div></div></aside><main class="main"><div class="topbar"><div class="breadcrumb">${manager()?'聯賽管理':'聯賽資訊'} <span>/</span><span>${labels[route]}</span></div><div class="topbar-actions"><span data-sync-status class="status">${statusText()}</span><span class="role-badge">${localAdmin?'本機管理者':manager()?'管理者':'參與者'}</span>${button(cloudUser||localAdmin?'帳號':'登入','account',false,'','class="account-button"')}</div></div><div class="content">${storageError?`<div class="notice error">${esc(storageError)}</div>`:''}${({overview:renderOverview,rank:renderRank,matches:renderMatches,players:renderPlayers,rules:renderRules,settings:renderSettings,voting:renderVoting})[route]()}<footer class="footer"><span>暗月聯賽　DARKMOON LEAGUE</span><span>${mode==='cloud'?'以雲端對局紀錄即時計算':manager()?'已載入原始 Excel 紀錄 · 本機變更請定期備份':'目前顯示本機紀錄 · 登入後查看雲端排名'}</span></footer></div></main></div>`;
 if(!manager()){
  document.querySelectorAll('#app [data-route]').forEach(el=>{if(!allowedRoutes(roleState()).includes(el.dataset.route))el.remove();});
  document.querySelectorAll('#app [data-action]').forEach(el=>{if(!canRunAction(el.dataset.action,roleState())){if(['player-detail','edit-match'].includes(el.dataset.action)){const label=document.createElement('span');label.className='player-name';label.textContent=el.textContent;el.replaceWith(label);}else el.remove();}});
  $('#app .storage-card')?.remove();
 }

function overviewActions(){return button('匯出備份','export',false,'download')+button('新增對局','new-match',true,'plus',editable()?'':'disabled');}
function renderOverview(){
 const s=buildStandings(data),games=data.matches.filter(completed),eligible=s.filter(p=>p.eligible),members=data.players.filter(p=>p.member).length;
 const stats=[['已完成對局',games.length,'場',`${data.matches.length-games.length} 場待記錄`,'matches'],['參賽玩家',data.players.length,'位',`${members} 位社員`,'players'],['獎品資格',eligible.length,'位','社員且參賽滿 6 場','cup'],['累計積分',short(s.reduce((n,p)=>n+p.total,0)),'分','所有已完成對局的原始總分','rank']];

function standingsPanel(rows,compact=false){

async function commit(next,expected){
 if(!editable())throw new Error(mode==='cloud'?'目前無雲端寫入權限，或尚未恢復連線。':'目前正在儲存，請稍候。');
 if(expected!==version())throw new Error('資料已在其他視窗或裝置更新。請關閉後重新開啟，再套用這次修改。');
 validateLeague(next);busy=true;document.body.classList.add('busy');
 try{
  if(mode==='cloud'){const session=cloud;const r=await session.save(next,revision);if(cloud===session&&mode==='cloud'&&revision<=r){data=next;revision=r;}}
  else{const existing=JSON.parse(localStorage.getItem(KEY)||'null');if(existing&&existing.revision!==localRevision)throw new Error('另一個視窗已更新資料，請重新整理後再試。');const nextRevision=localRevision+1;localStorage.setItem(KEY,JSON.stringify({revision:nextRevision,data:next}));localRevision=nextRevision;localData=next;data=next;storageError='';}
 }finally{busy=false;document.body.classList.remove('busy');}
 render();
}

}
async function configuredHtml(){
 const cfg=parseConfig($('#firebase-config')?.value||configValue);const id=$('#league-id')?.value||leagueId;if(!/^[A-Za-z0-9_-]{1,60}$/.test(id))throw new Error('聯賽代號限 1～60 位英數字、底線或連字號。');
 // The published and downloadable page is self contained. Inject public config only.
 const html=window.__DARKMOON_HTML__||await fetch(location.href.split('#')[0]).then(r=>{if(!r.ok)throw new Error('讀取網頁失敗');return r.text();});
 const configScript=`<script>window.DARKMOON_CONFIG=${JSON.stringify({config:cfg,leagueId:id}).replace(/</g,'\\u003c')};<\/script>`;
 download('暗月聯賽-Firebase.html',html.replace(/^[ \t]*<script id="embedded-config">[^\r\n]*?<\/script>\r?\n?/gm,'').replace('</head>',()=>configScript.replace('<script>','<script id="embedded-config">')+'\n</head>'),'text/html;charset=utf-8');toast('已下載含公開設定的 HTML，開啟後仍須登入');
}
async function handleAction(action,id){
 if(!canRunAction(action,roleState()))throw new Error('此功能僅限管理者使用。');
 if(action==='account')showAccount();
 if(action==='open-voting'){if(mode!=='cloud')throw new Error('請先將聯賽匯入 Firebase。');const m=data.matches.find(x=>x.id===id);if(!confirm('開啟後，本場座位名單會公開並開始接受 MVP 投票，確定開啟？'))return;await cloud.voting.open(m);toast('比賽已開啟，參與者登入後將進入投票畫面');}
 if(action==='close-voting'){if(!confirm('確定結束本場投票？結束後無法追加或修改投票。'))return;await cloud.voting.close(id);toast('投票已結束，結果持續公開');}
 if(action==='cast-vote'){if(!cloudUser){showAccount();return;}const choice=document.querySelector('[name=vote-'+CSS.escape(id)+']:checked')?.value;if(!choice)throw new Error('請選擇一位 MVP。');await cloud.voting.vote(id,choice);toast('投票成功');}
 if(action==='new-match')editMatch();if(action==='edit-match')editMatch(id);if(action==='new-player')editPlayer();if(action==='edit-player')editPlayer(id);if(action==='player-detail')playerDetail(id);if(action==='matrix')matrix();if(action==='close-dialog')closeDialog();if(action==='export')exportData();if(action==='csv')exportCsv();
 if(action==='import')$('#import-file').click();
 if(action==='disconnect'){if(busy||connecting)throw new Error('請等待目前操作完成。');++connectionEpoch;polls=[];autoVoteKey='';await cloud?.disconnect();cloud=null;cloudUser=null;canEdit=false;cloudExists=false;cloudReady=false;mode='local';data=localData;cloudStatus={kind:'offline',message:'已切回本機模式'};try{const saved=JSON.parse(localStorage.getItem(CONFIG)||'null');if(saved)localStorage.setItem(CONFIG,JSON.stringify({...saved,autoConnect:false}));}catch{}render();toast('已切回原本的本機資料');}
 if(action==='logout'){if(busy||connecting)throw new Error('請等待目前操作完成。');await cloud?.logout();localAdmin=false;closeDialog(true);mode='local';data=localData;render();toast('已登出，回到參與者畫面');}
 if(action==='initialize'){if(busy||connecting||!cloudReady||!canEdit)throw new Error('請等待雲端資料及管理員權限確認。');if(!confirm(`將目前 ${localData.players.length} 位玩家、${localData.matches.filter(completed).length} 場成績匯入「${leagueId}」？只會建立空白聯賽，不覆蓋既有資料。`))return;busy=true;try{await cloud.initialize(localData);toast('本機資料已匯入 Firebase');}finally{busy=false;render();}}
 if(action==='delete-match'){if(!confirm('確定刪除此對局？積分將重新計算。'))return;if(polls.some(p=>p.id===editingMatch.id))throw new Error('已開放投票的對局不可刪除。');const next=copy(data);next.matches=next.matches.filter(m=>m.id!==editingMatch.id);await commit(next,editingVersion);closeDialog(true);toast('已刪除對局');}
 if(action==='delete-player'){if(data.matches.some(m=>m.entries.some(e=>e.playerId===editingPlayerId)))throw new Error('此玩家仍有對局紀錄，請先在對局中移除該玩家。');if(!confirm('確定刪除此玩家？'))return;const next=copy(data);next.players=next.players.filter(p=>p.id!==editingPlayerId);await commit(next,editingVersion);closeDialog(true);toast('已刪除玩家');}
 if(action==='download-rules'){download('firestore.rules',window.DARKMOON_RULES||await fetch('./firestore.rules').then(r=>r.text()),'text/plain');}
 if(action==='setup-guide'){const text=window.DARKMOON_GUIDE||await fetch('./setup-guide.md').then(r=>r.text());download('Firebase設定說明.md',text,'text/markdown;charset=utf-8');}
 if(action==='configured-html')await configuredHtml();
}
document.addEventListener('click',async event=>{
 const nav=event.target.closest('[data-route]');if(nav){if(!allowedRoutes(roleState()).includes(nav.dataset.route)){toast('此頁面僅限管理者使用。',true);return;}route=nav.dataset.route;query='';render();window.scrollTo(0,0);return;}
 const rank=event.target.closest('[data-rank-filter]');if(rank){rankFilter=rank.dataset.rankFilter;render();return;}
 const filter=event.target.closest('[data-match-filter]');if(filter){matchFilter=filter.dataset.matchFilter;render();return;}
 const action=event.target.closest('[data-action]');if(action){event.preventDefault();try{await handleAction(action.dataset.action,action.dataset.id);}catch(error){toast(error.message,true);}}
});
document.addEventListener('input',event=>{if(event.target.matches('[data-search]')){const pos=event.target.selectionStart;query=event.target.value;render();const field=$('[data-search]');field.focus();field.setSelectionRange(pos,pos);}if(event.target.closest('#editor')&&$('#editor').dataset.kind==='management'){editorDirty=true;if(event.target.closest('#match-form'))updateScores();}});
$('#editor').addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
document.addEventListener('submit',async event=>{
 event.preventDefault();const form=event.target;const submit=form.querySelector('[type=submit]');if(submit)submit.disabled=true;
 try{
  if(!['account-login-form','account-config-form'].includes(form.id)&&!manager())throw new Error('此操作僅限管理者使用。');
  if(form.id==='account-config-form'){const cfg=parseConfig($('#account-config').value),id=$('#account-league').value.trim();configValue=JSON.stringify(cfg,null,2);localStorage.setItem(CONFIG,JSON.stringify({config:cfg,leagueId:id,autoConnect:true}));await connect(cfg,id);showAccount();toast('設定已儲存，請登入帳號');}
  if(form.id==='account-login-form'){
 const username=$('#account-email').value.trim(),password=$('#account-password').value;
 if(username==='ntnuwsc'){
  if(!await verifyLocalAdmin(username,password))throw new Error('帳號或密碼不正確。');
  ++connectionEpoch;await cloud?.disconnect();cloud=null;cloudUser=null;canEdit=false;cloudExists=false;cloudReady=false;polls=[];mode='local';data=localData;localAdmin=true;route='overview';
  closeDialog(true);render();toast('已登入本機管理者 ntnuwsc');
 }else{if(!cloud)throw new Error('請先完成 Firebase 連線設定，或使用本機管理帳號。');await cloud.login(username,password);closeDialog(true);toast('已登入，正在確認帳號權限');}
}
  if(form.id==='match-form'){const m=readMatch();const poll=polls.find(p=>p.id===m.id);if(poll){const before=data.matches.find(x=>x.id===m.id);const roster=x=>JSON.stringify(x.entries.map(e=>[e.seat,e.playerId,e.role,e.faction]));if(m.board!==before.board||roster(m)!==roster(before))throw new Error('已開啟投票，不能修改板子、座位或身分；仍可記錄勝方與成績。');}const next=copy(data);const i=next.matches.findIndex(x=>x.id===m.id);if(i<0)next.matches.push(m);else next.matches[i]=m;await commit(next,editingVersion);closeDialog(true);toast(m.status==='completed'?'對局已儲存，排名已更新':'草稿已儲存');}
  if(form.id==='player-form'){const name=$('#player-name').value.trim(),member=$('#player-member').checked;if(!name)throw new Error('請輸入玩家姓名。');const next=copy(data);if(editingPlayerId){const p=next.players.find(p=>p.id===editingPlayerId);p.name=name;p.member=member;p.membership=member?'社員':'非社員';next.matches.forEach(m=>m.entries.forEach(e=>{if(e.playerId===p.id)e.playerName=name;}));}else next.players.push({id:'p-'+crypto.randomUUID(),name,member,membership:member?'社員':'非社員'});await commit(next,editingVersion);closeDialog(true);toast('玩家資料已儲存');}
  if(form.id==='config-form'){const cfg=parseConfig($('#firebase-config').value),id=$('#league-id').value.trim();configValue=JSON.stringify(cfg,null,2);localStorage.setItem(CONFIG,JSON.stringify({config:cfg,leagueId:id,autoConnect:true}));await connect(cfg,id);toast('已儲存設定，請登入以讀取雲端資料');}
  if(form.id==='login-form'){await cloud.login($('#login-email').value.trim(),$('#login-password').value);toast('登入成功，正在讀取聯賽');}
 }catch(error){const errorId={'account-config-form':'account-config-error','account-login-form':'account-login-error','match-form':'match-error','player-form':'player-error','config-form':'config-error','login-form':'login-error'}[form.id];const out=$('#'+errorId);if(out)out.textContent=error.message;else toast(error.message,true);}finally{if(submit)submit.disabled=false;}
});
document.addEventListener('change',async event=>{if(event.target.id!=='import-file')return;const file=event.target.files[0];if(!file)return;const expected=version();try{if(!manager())throw new Error('還原備份僅限管理者使用。');if(file.size>800000)throw new Error('備份檔案過大，上限為 800 KB。');const next=JSON.parse(await file.text());validateLeague(next);if(!confirm(`還原後會取代目前${mode==='cloud'?'雲端':'本機'}資料：${next.players.length} 位玩家、${next.matches.length} 場紀錄。確定繼續？`))return;await commit(next,expected);toast('備份已還原');}catch(error){toast(error.message,true);}event.target.value='';});
window.addEventListener('storage',event=>{if(event.key!==KEY)return;try{const saved=JSON.parse(event.newValue||'null');if(!saved)return;validateLeague(saved.data);localData=saved.data;localRevision=saved.revision;if(mode==='local'){data=localData;render();toast('已載入另一個視窗的最新資料');}}catch{toast('另一個視窗的資料無法讀取，請先備份。',true);}});
window.addEventListener('beforeunload',event=>{if(editorDirty||busy){event.preventDefault();event.returnValue='';}});
render();
if(window.DARKMOON_CONFIG||savedConfig){const preset=window.DARKMOON_CONFIG||savedConfig;configValue=JSON.stringify(preset.config,null,2);leagueId=preset.leagueId||'darkmoon';connect(preset.config,leagueId).catch(error=>toast(error.message,true));}

</script>
